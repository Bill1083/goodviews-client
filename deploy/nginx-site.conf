# nginx settings for the WEBSITE (the built client in dist/), not the API.
#
# The real nginx config lives only on the VPS. Merge these directives into the
# website's `server { ... }` block there (inside the client container's nginx
# config, or the host's, whichever serves dist/). Replace the two
# <PLACEHOLDERS> in the CSP line first, then `nginx -t` before reloading.
#
# What it does:
#   1. Security headers: link scanners and site-reputation checks look for these.
#   2. Single-page-app routing that also serves the pre-built per-page HTML
#      (dist/about/index.html etc.), so /about gets its own <title> and
#      description even for crawlers that don't run JavaScript.
#   3. Caching: hashed /assets/ files cached for a year, HTML always revalidated.
#
# Note: nginx drops server-level add_header lines inside any location block
# that has its own add_header. The location blocks below deliberately use
# `expires` (not add_header) so the security headers still apply to them.

# ── 1. Security headers ──────────────────────────────────────────────────────
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content Security Policy, in REPORT-ONLY mode: browsers log violations to the
# console but block nothing. Use the site for a few days (sign in, Discover,
# a film page, Wrapped share, Settings, 2FA); if the console shows no CSP
# reports, rename the header to Content-Security-Policy to enforce it.
#   <API_ORIGIN>      e.g. https://api.goodviews.online
#   <SUPABASE_HOST>   the host from VITE_SUPABASE_URL, e.g. abcd1234.supabase.co
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://image.tmdb.org; connect-src 'self' <API_ORIGIN> https://<SUPABASE_HOST> wss://<SUPABASE_HOST>; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ── 2. Routing ───────────────────────────────────────────────────────────────
# /about → dist/about/index.html (pre-built head), unknown paths → the app.
location / {
    try_files $uri $uri/index.html /index.html;
    expires -1;   # HTML and small root files: always revalidate
}

# robots.txt, sitemap.xml and .well-known/security.txt must be reachable.
location ^~ /.well-known/ {
    try_files $uri =404;
}

# ── 3. Long cache for content-hashed build output ───────────────────────────
location /assets/ {
    try_files $uri =404;
    expires 1y;
}
