server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes every built JS/CSS filename (e.g. index-D74FDFJ-.js)
    # — the name itself changes whenever the content does, so these are safe
    # to cache for as long as a browser (or any proxy in front of it) wants.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file that must NEVER be served stale — it's what
    # decides which hashed JS/CSS bundle loads. With no explicit header here,
    # it was subject to whatever heuristic caching a browser or an
    # intermediate proxy (a corporate/school network, some mobile carriers,
    # some VPNs) felt like applying — which is how two people on the same
    # deploy can end up seeing two different versions of the app.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
